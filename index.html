<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Бауке — 21 ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #090909;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,0.06),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255,255,255,0.04),
                    transparent 30%
                ),
                #090909;
        }

        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
        }

        .glow.one {
            background: #ffffff;
            top: -200px;
            left: -150px;
        }

        .glow.two {
            background: #888888;
            right: -180px;
            bottom: -180px;
        }

        /* =========================================
           START SCREEN
        ========================================= */

        .start-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            background: #090909;
            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        .start-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-content {
            width: 100%;
            max-width: 700px;
            animation: startAppear 1s ease;
        }

        @keyframes startAppear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .date {
            margin-bottom: 25px;
            color: #777;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .start-title {
            font-size: clamp(60px, 14vw, 130px);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -6px;
        }

        .start-title span {
            display: block;
            margin-top: 15px;
            color: #777;
            font-size: 0.65em;
            letter-spacing: -3px;
        }

        .start-description {
            max-width: 500px;
            margin: 35px auto;
            color: #999;
            font-size: 17px;
            line-height: 1.7;
        }

        .start-button {
            padding: 16px 34px;
            border: none;
            border-radius: 100px;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,255,255,0.12);
        }

        /* =========================================
           MAIN
        ========================================= */

        .site {
            width: 100%;
            max-width: 950px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-name {
            font-size: 18px;
            font-weight: 700;
        }

        .counter {
            color: #666;
            font-size: 13px;
            letter-spacing: 3px;
        }

        /* =========================================
           CARD
        ========================================= */

        .card-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 650px;
        }

        .card {
            width: 100%;
            padding: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );
            box-shadow: 0 30px 100px rgba(0,0,0,0.35);
            backdrop-filter: blur(20px);
            animation: cardAppear 0.5s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-number {
            margin-bottom: 25px;
            color: #666;
            font-size: 13px;
            letter-spacing: 5px;
        }

        .card-title {
            max-width: 750px;
            margin-bottom: 20px;
            font-size: clamp(30px, 5.5vw, 55px);
            font-weight: 750;
            line-height: 1.1;
            letter-spacing: -1.5px;
        }

        .card-text {
            max-width: 700px;
            margin-bottom: 10px;
            color: #999;
            font-size: 18px;
            line-height: 1.75;
        }

        /* =========================================
           PHOTO / MEDIA CONTAINER
        ========================================= */

        .photo {
            width: 100%;
            height: 440px;
            margin-top: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-placeholder {
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #666;
            text-align: center;
        }

        .photo img,
        .photo video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000000;
        }

        /* =========================================
           NAVIGATION
        ========================================= */

        .navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
        }

        .nav-button {
            padding: 13px 20px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 100px;
            background: rgba(255,255,255,0.04);
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .nav-button:hover {
            background: rgba(255,255,255,0.1);
        }

        .nav-button:disabled {
            opacity: 0.2;
            cursor: default;
        }

        /* =========================================
           PROGRESS
        ========================================= */

        .progress {
            width: 100%;
            height: 2px;
            margin-top: 25px;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
        }

        .progress-bar {
            width: 10%;
            height: 100%;
            background: #ffffff;
            transition: width 0.4s ease;
        }

        /* =========================================
           FINAL SCREEN
        ========================================= */

        .final-card {
            text-align: center;
        }

        .final-number {
            margin-bottom: 25px;
            color: #666;
            font-size: 13px;
            letter-spacing: 5px;
        }

        .final-title {
            margin-bottom: 25px;
            font-size: clamp(42px, 8vw, 85px);
            line-height: 0.95;
            letter-spacing: -3px;
        }

        .final-text {
            max-width: 600px;
            margin: 0 auto;
            color: #999;
            font-size: 18px;
            line-height: 1.7;
        }

        .secret-button {
            margin-top: 35px;
            padding: 15px 30px;
            border: none;
            border-radius: 100px;
            background: #ffffff;
            color: #000000;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .secret-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,255,255,0.12);
        }

        .secret-message {
            display: none;
            max-width: 700px;
            margin: 40px auto 0;
            padding: 35px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 25px;
            background: rgba(255,255,255,0.035);
            animation: secretAppear 0.8s ease;
        }

        .secret-message.show {
            display: block;
        }

        @keyframes secretAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .secret-message h3 {
            margin-bottom: 20px;
            font-size: 30px;
        }

        .secret-message p {
            color: #aaa;
            font-size: 17px;
            line-height: 1.8;
        }

        /* =========================================
           CONFETTI
        ========================================= */

        .confetti {
            position: fixed;
            top: -20px;
            width: 8px;
            height: 14px;
            z-index: 200;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {
            .site {
                padding: 20px 15px 35px;
            }

            .card-container {
                min-height: 580px;
            }

            .card {
                padding: 30px 22px;
                border-radius: 23px;
            }

            .card-title {
                font-size: 32px;
            }

            .card-text {
                font-size: 16px;
            }

            .photo {
                height: 320px;
                margin-top: 20px;
            }

            .start-title {
                letter-spacing: -4px;
            }

            .start-description {
                font-size: 16px;
            }

            .nav-button {
                padding: 11px 15px;
                font-size: 13px;
            }

            .final-title {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<!-- START SCREEN -->
<div class="start-screen" id="startScreen">
    <div class="start-content">
        <div class="date">21 жас</div>
        <div class="start-title">
            Бауке
            <span>21</span>
        </div>
        <p class="start-description">
            Креативті құттықтау болсын деп,
            <br>
            «Туған күніңмен, бро» деген
            <br><br>
            жай сөз сияқты көрінді.
        </p>
        <button class="start-button" onclick="startSite()">
            Бастау →
        </button>
    </div>
</div>

<!-- MAIN SITE -->
<main class="site">
    <header class="header">
        <div class="header-name">Бауке</div>
        <div class="counter" id="counter">01 / 10</div>
    </header>

    <section class="card-container">
        <div class="card" id="card">
            <div class="card-number" id="cardNumber">01</div>
            <h1 class="card-title" id="cardTitle">Алар асуың биік болсын!</h1>
            <p class="card-text" id="cardText"></p>
            <div class="photo" id="photo"></div>
        </div>
    </section>

    <div class="navigation">
        <button class="nav-button" id="prevButton" onclick="previousCard()" disabled>
            ← Артқа
        </button>
        <button class="nav-button" id="nextButton" onclick="nextCard()">
            Келесі →
        </button>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</main>

<script>
/* =========================================
   КАРТОЧКАЛАР ТІЗІМІ
========================================= */
const cards = [
    {
        title: "Алар асуың биік болсын!",
        text: "",
        photo: "photo_2026-08-19_17-14-00.jpg"
    },
    {
        title: "Басың мықты идеяларға толы болсын!",
        text: "",
        photo: "WhatsApp Image 2026-08-19 at 16.54.00.jpeg"
    },
    {
        title: "Спортты қатар алып жүр.",
        text: "Пиковый формаңды қайтар уже! 💪",
        photo: "video_2026-08-19_17-13-45.mp4"
    },
    {
        title: "Кот в шоке, Бауке доволен.",
        text: "Кот: «Я не понял, почему этот 21-летний кожаный держит меня и так подозрительно улыбается?!»",
        photo: "WhatsApp Image 2026-08-19 at 17.00.43.jpeg"
    },
    {
        title: "Бастан кешкен барлық оқиғалар үшін.",
        text: "",
        photo: "WhatsApp Image 2026-08-19 at 16.54.45.jpeg"
    },
    {
        title: "Совместный проекттер көп бола берсін!",
        text: "",
        photo: "WhatsApp Image 2026-08-19 at 16.53.01.jpeg"
    },
    {
        title: "Әрқашан мақсатыңа нық қадам басуың үшін.",
        text: "Будь всегда таким же целеустремленным, как на подъеме по «Лестнице здоровья».",
        photo: "WhatsApp Image 2026-08-19 at 16.57.06.jpeg"
    },
    {
        title: "Уақыт арамызды суытпайтыны үшін.",
        text: "Ұзақ уақыт көріспеуіміз мүмкін. Әркімнің өз шаруасы, жұмысы, оқуы мен тірлігі бар. Бірақ қайта кездескенде — арада уақыт өтпегендей сол баяғыша болуымызда.",
        photo: "WhatsApp Image 2026-08-19 at 16.55.59.jpeg"
    },
    {
        title: "Мынау щегол бүгін ол мықты тұлға!",
        text: "",
        photo: "photo_2026-08-19_17-13-57.jpg"
    },
    {
        title: "Сенің бар болғаның үшін.",
        text: "Өмірімде осындай адал досым бар болғаны үшін. Маған сендей бауыр бұйырғанына қуаныштымын.",
        photo: "WhatsApp Image 2026-08-19 at 16.55.03.jpeg"
    }
];

let currentCard = 0;

const startScreen = document.getElementById("startScreen");
const card = document.getElementById("card");
const cardNumber = document.getElementById("cardNumber");
const cardTitle = document.getElementById("cardTitle");
const cardText = document.getElementById("cardText");
const photo = document.getElementById("photo");
const counter = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");

function startSite() {
    startScreen.classList.add("hidden");
}

function showCard() {
    const item = cards[currentCard];

    card.style.animation = "none";
    void card.offsetWidth;
    card.style.animation = "cardAppear 0.5s ease";

    cardNumber.textContent = String(currentCard + 1).padStart(2, "0");
    cardTitle.textContent = item.title;
    
    // Мәтін болмаса абзацты жасырып, артық бос орынды жою
    if (item.text && item.text.trim() !== "") {
        cardText.textContent = item.text;
        cardText.style.display = "block";
    } else {
        cardText.textContent = "";
        cardText.style.display = "none";
    }

    counter.textContent = String(currentCard + 1).padStart(2, "0") + " / " + cards.length;

    const progress = ((currentCard + 1) / cards.length) * 100;
    progressBar.style.width = progress + "%";

    if (item.photo && item.photo !== "") {
        const isVideo = item.photo.toLowerCase().endsWith(".mp4") || 
                        item.photo.toLowerCase().endsWith(".mov") || 
                        item.photo.toLowerCase().endsWith(".webm");
        if (isVideo) {
            photo.innerHTML = `
                <video src="${item.photo}" controls playsinline muted autoplay loop preload="auto">
                    Ваш браузер не поддерживает видео.
                </video>
            `;
            const vid = photo.querySelector("video");
            vid.play().catch(e => {
                console.log("Автоойнату бұғатталды, қолмен басу керек:", e);
            });
        } else {
            photo.innerHTML = `<img src="${item.photo}" alt="Естелік">`;
        }
    } else {
        photo.innerHTML = `
            <div class="photo-placeholder">
                📸<br><br>Мұнда фото/видео болады
            </div>
        `;
    }

    prevButton.disabled = (currentCard === 0);

    if (currentCard === cards.length - 1) {
        nextButton.textContent = "Соңы →";
    } else {
        nextButton.textContent = "Келесі →";
    }
}

function nextCard() {
    if (currentCard < cards.length - 1) {
        currentCard++;
        showCard();
    } else {
        showFinal();
    }
}

function previousCard() {
    if (currentCard > 0) {
        currentCard--;
        showCard();
    }
}

function showFinal() {
    card.innerHTML = `
        <div class="final-card">
            <div class="final-number">11</div>
            <h2 class="final-title">
                Осымен бітті<br>деп ойладың ба?
            </h2>
            <p class="final-text">
                Тағы бір басты себеп бар.
                <br><br>
                Бірақ оны жай ғана сөзбен жеткізу мүмкін емес.
            </p>
            <button class="secret-button" onclick="showSecret()">
                Білу →
            </button>
            <div class="secret-message" id="secretMessage">
                <h3>Өйткені сен — менің бауырымсың.</h3>
                <p>
                    Ал бұған ешқандай артық түсініктеменің қажеті жоқ.
                    <br><br>
                    Қазір бір-бірімізден алыста болсақ та, бірақ бұл жай ғана қашықтық.
                    <br><br>
                    Барлығы үшін рақмет саған, Бауке.
                    <br><br>
                    21 жасың құтты болсын, бауырым! ❤️
                </p>
            </div>
        </div>
    `;

    document.querySelector(".navigation").style.display = "none";
    progressBar.style.width = "100%";
    createConfetti();
}

function showSecret() {
    const secret = document.getElementById("secretMessage");
    secret.classList.add("show");
    createConfetti();
}

function createConfetti() {
    for (let i = 0; i < 90; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDuration = (2 + Math.random() * 3) + "s";
        piece.style.opacity = 0.5 + Math.random() * 0.5;
        piece.style.background = ["#ffffff", "#ff4444", "#ffd700", "#ff69b4"][Math.floor(Math.random() * 4)];
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 5000);
    }
}

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") nextCard();
    if (event.key === "ArrowLeft") previousCard();
});

showCard();
</script>

</body>
</html>
